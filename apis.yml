image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/tadeus-api.png
name: Tadeus API
description: >-
  Tadeus is an AI voice agent platform for workforce platforms: one agent holds real,
  adaptive voice conversations with every employee at scale, in their own language, and
  returns structured, timestamped records to the HCM, payroll, scheduling and compliance
  systems people already use. It works from the transcript rather than the audio and reports
  comprehension and engagement signals about responses rather than inferring emotion, which
  is the position its published EU AI Act documentation rests on. The public Integration API
  is a 47-operation REST surface for creating interview templates and campaigns, inviting
  participants individually or in bulk, creating anonymous sessions, and retrieving
  transcripts, structured results with per-response quality signals, and cross-session AI
  insights. Tadeus went generally available on 14 July 2026 and also ships a hosted,
  first-party MCP server so agents can commission interviews and query results as tool calls.
