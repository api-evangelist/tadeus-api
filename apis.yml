x-absences:
  note: >-
    Recorded, evidenced absences. Each was probed on 2026-08-11 and each is deliberately NOT
    given a common[] pointer, so nothing here is credited to Tadeus as a published surface.
  surfaces:
  - surface: WellKnown / SecurityTxt
    file: well-known/tadeus-api-well-known.yml
    finding: >-
      Every /.well-known/ path on every Tadeus host returns 403 from the edge. No
      security.txt, no OIDC/OAuth metadata, no api-catalog, no ai-plugin.
  - surface: AgentCard
    finding: >-
      /.well-known/agent-card.json and /.well-known/agent.json return 403 on tadeus.net,
      www.tadeus.net and app.tadeus.net. No card exists; none was authored.
  - surface: Security (vulnerability disclosure)
    file: security/tadeus-api-vulnerability-disclosure.yml
    finding: >-
      No disclosure policy, no security contact, no bug bounty, no security.txt, no
      /security page (404).
  - surface: SDKs / Packages
    file: packages/tadeus-api-packages.yml
    finding: >-
      No first-party client library on npm or PyPI and no GitHub organisation. The official
      examples use third-party `requests` plus cURL.
  - surface: RateLimits
    file: rate-limits/tadeus-api-rate-limits.yml
    finding: >-
      No limits documented and no RateLimit-*/Retry-After headers observed. limit_count is 0.
  - surface: StatusPage
    finding: 'status.tadeus.net does not resolve; https://tadeus.net/status returns 404.'
  - surface: Deprecation
    finding: No deprecation or versioning policy published; no Sunset/Deprecation headers.
  - surface: ChangeLog
    finding: >-
      https://tadeus.net/changelog returns 404. The company blog carries the GA
      announcement but is not an API changelog.
  - surface: Webhooks / AsyncAPI
    finding: >-
      Webhooks are marketed ("POST /v1/webhooks write back on events" on the homepage,
      "Webhooks-ready" on the docs) but no endpoint, event catalog, payload schema, signing
      scheme or retry policy is published anywhere, and no webhook path exists in the spec.
  - surface: OAuthScopes
    finding: Key-pair auth only; no OAuth 2.0, no scopes. Artifact correctly skipped.
  - surface: Sandbox / CLI / Components / Postman / GitHubOrganization / Roadmap
    finding: None published.
