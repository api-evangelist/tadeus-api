cross_cutting_rules_every_skill_carries:
  - >-
    Both X-API-KEY-ID and X-API-SECRET headers are required on every request; the spec's
    OR-semantics security array understates this.
  - >-
    The base host is app.tadeus.net. The provider's own published examples use tadeus.net,
    which 404s.
  - >-
    There is no idempotency key on any operation, including the ones that email real
    employees. Reconcile with a list call before retrying a POST.
  - >-
    The spec declares zero 4xx/5xx responses. Errors are the DRF {"detail": "..."} envelope.
  - >-
    No rate limits and no rate-limit headers are published. max_sessions, attempts_allowed
    and the credit balance are the only ceilings.
  - >-
    Quality signals (confidence, relevance, sentiment, engagement) describe responses, not
    people. Reporting them per individual changes the EU AI Act classification of the
    deployment.
